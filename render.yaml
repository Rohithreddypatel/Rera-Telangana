services:
  # ── Backend ───────────────────────────────────────────────────────────
  - type: web
    name: rera-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false          # you'll paste this in Render dashboard
      - key: API_KEY
        sync: false          # you'll paste this in Render dashboard
      - key: CLIENT_ORIGIN
        sync: false          # you'll paste the frontend URL after it's deployed
      - key: MAX_SESSIONS
        value: 2             # keep low on free tier (512 MB RAM)

  # ── Frontend ──────────────────────────────────────────────────────────
  - type: web
    name: rera-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # you'll paste the backend URL after it's deployed
      - key: VITE_API_KEY
        sync: false          # same API_KEY as the server
    routes:
      - type: rewrite
        source: /*
        destination: /index.html